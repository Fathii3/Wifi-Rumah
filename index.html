<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Connect</title>
    <!-- Modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Load qrcode.js library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <!-- Background animation elements -->
    <div class="blob shape-1"></div>
    <div class="blob shape-2"></div>
    <div class="blob shape-3"></div>

    <!-- Floating Glass Particles -->
    <div class="glass-particle p1"></div>
    <div class="glass-particle p2"></div>
    <div class="glass-particle p3"></div>
    <div class="glass-particle p4"></div>
    <div class="glass-particle p5"></div>
    <div class="glass-particle p6"></div>

    <div class="glass-card">
        <div class="header">
            <h1 class="title">Wi-Fi Connect</h1>
            <p class="subtitle">Pilih metode untuk terhubung</p>
        </div>

        <div class="toggle-container">
            <button class="toggle-btn active" id="btn-qr" onclick="showQR()">QR Code</button>
            <button class="toggle-btn" id="btn-pwd" onclick="showPassword()">Kata Sandi</button>
        </div>
        
        <!-- Tab QR -->
        <div id="tab-qr" class="tab-content active">
            <div class="qr-container">
                <div id="qrcode"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: center;">
                <button class="download-btn" onclick="downloadQR()" style="margin-bottom: 0; width: 100%; max-width: 200px; justify-content: center;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Unduh QR
                </button>
                <button class="download-btn" onclick="openScanner()" style="margin-bottom: 20px; width: 100%; max-width: 200px; justify-content: center; background: rgba(0, 0, 0, 0.1);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><circle cx="12" cy="12" r="2"></circle></svg>
                    Buka Scanner
                </button>
            </div>
        </div>

        <!-- Tab Password -->
        <div id="tab-pwd" class="tab-content">
            <div class="password-box">
                <div class="pwd-label">Kata Sandi Wi-Fi:</div>
                <div class="pwd-value" id="wifi-password-display">Loading...</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="download-btn" onclick="copyPassword()" id="copy-btn" style="margin-bottom: 0;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Salin Sandi
                </button>
                <button class="download-btn" onclick="openWifiSettings()" style="margin-bottom: 20px; background: rgba(0, 0, 0, 0.1);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Buka Pengaturan Wi-Fi
                </button>
            </div>
        </div>
        
        <div class="footer">
            <span id="wifi-name-display">Loading...</span>
        </div>
        <div class="watermark">by: family pak harun</div>
    </div>
    
    <!-- Glass Popup Notification -->
    <div id="glass-popup" class="glass-popup-overlay">
        <div class="glass-popup-box">
            <h3 class="popup-title" id="popup-title-text">Pemberitahuan</h3>
            <p class="popup-message" id="popup-message-text">Pesan</p>
            <button class="popup-close-btn" onclick="closePopup()">Tutup</button>
        </div>
    </div>

    <!-- Load config and logic -->
    <script src="config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof wifiConfig !== 'undefined') {
                const { ssid, password, encryption } = wifiConfig;
                
                // Display SSID on UI
                document.getElementById('wifi-name-display').innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: middle; margin-bottom: 2px;">
                        <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                        <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                        <line x1="12" y1="20" x2="12.01" y2="20"></line>
                    </svg>
                    ${ssid}
                `;
                // Display Password on UI
                document.getElementById('wifi-password-display').innerText = password;

                // Wi-Fi string format yang paling standar: WIFI:S:<ssid>;T:<encryption>;P:<password>;;
                const wifiString = `WIFI:S:${ssid};T:${encryption};P:${password};;`;
                
                // Generate QR Code with custom styling
                new QRCode(document.getElementById("qrcode"), {
                    text: wifiString,
                    width: 150,
                    height: 150,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } else {
                document.getElementById('qrcode').innerHTML = '<p class="error-message">Error: config.js missing.</p>';
            }
        });

        // Popup Functions
        function showGlassPopup(message, title = "Pemberitahuan") {
            document.getElementById('popup-title-text').innerText = title;
            document.getElementById('popup-message-text').innerText = message;
            document.getElementById('glass-popup').classList.add('active');
        }

        function closePopup() {
            document.getElementById('glass-popup').classList.remove('active');
        }

        // Toggle Functions
        function showQR() {
            document.getElementById('tab-qr').classList.add('active');
            document.getElementById('tab-pwd').classList.remove('active');
            document.getElementById('btn-qr').classList.add('active');
            document.getElementById('btn-pwd').classList.remove('active');
        }

        function showPassword() {
            document.getElementById('tab-pwd').classList.add('active');
            document.getElementById('tab-qr').classList.remove('active');
            document.getElementById('btn-pwd').classList.add('active');
            document.getElementById('btn-qr').classList.remove('active');
        }

        // Download Function
        function downloadQR() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            if (qrCanvas) {
                // Buat canvas baru untuk menambahkan latar belakang putih (padding/quiet zone)
                const padding = 20;
                const newCanvas = document.createElement('canvas');
                newCanvas.width = qrCanvas.width + (padding * 2);
                newCanvas.height = qrCanvas.height + (padding * 2);
                
                const ctx = newCanvas.getContext('2d');
                // Isi dengan latar belakang putih
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, newCanvas.width, newCanvas.height);
                
                // Gambar QR Code di tengah canvas baru
                ctx.drawImage(qrCanvas, padding, padding);

                const link = document.createElement('a');
                link.download = 'Wi-Fi_QR_Code.png';
                link.href = newCanvas.toDataURL("image/png");
                link.click();
            } else {
                // Fallback for browsers returning an img instead
                const img = document.querySelector('#qrcode img');
                if (img && img.src) {
                    const link = document.createElement('a');
                    link.download = 'Wi-Fi_QR_Code.png';
                    link.href = img.src;
                    link.click();
                } else {
                    showGlassPopup("Gagal mengunduh QR Code. Coba muat ulang halaman.", "Error");
                }
            }
        }

        // Copy Password Function
        function copyPassword() {
            if (typeof wifiConfig !== 'undefined') {
                navigator.clipboard.writeText(wifiConfig.password).then(() => {
                    const btn = document.getElementById('copy-btn');
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Tersalin!';
                    btn.style.background = 'rgba(16, 185, 129, 0.5)'; // Glassy green
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                        btn.style.background = ''; // Kembali ke warna awal
                    }, 2000);
                }).catch(err => {
                    console.error('Gagal menyalin:', err);
                    showGlassPopup("Gagal menyalin kata sandi. Silakan blok tulisan dan salin secara manual.", "Gagal");
                });
            }
        }

        // Open Wi-Fi Settings Function
        function openWifiSettings() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(ua)) {
                // Untuk HP Android
                window.location.href = "intent:#Intent;action=android.settings.WIFI_SETTINGS;end";
                
                setTimeout(() => {
                    if (document.visibilityState === 'visible') {
                        showGlassPopup("Tidak dapat membuka pengaturan Wi-Fi secara otomatis. Silakan buka Pengaturan HP Anda secara manual.", "Aksi Gagal");
                    }
                }, 1500);
            } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
                // Untuk iPhone/iOS
                window.location.href = "App-Prefs:root=WIFI";
                
                setTimeout(() => {
                    if (document.visibilityState === 'visible') {
                        showGlassPopup("Tidak dapat membuka pengaturan Wi-Fi secara otomatis. Silakan buka aplikasi Pengaturan secara manual.", "Aksi Gagal");
                    }
                }, 1500);
            } else {
                showGlassPopup("Fitur buka pengaturan otomatis hanya tersedia di HP Android dan iPhone.", "Tidak Didukung");
            }
        }

        // Open Scanner Function (Google Lens via Google App)
        function openScanner() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(ua)) {
                // Tampilkan pesan instruksi karena Google memblokir akses langsung ke internal Lens dari web
                showGlassPopup("Sistem Android membatasi akses langsung ke kamera Google Lens dari web.\n\nSebentar lagi aplikasi Google akan terbuka. Silakan ketuk ikon Kamera (Lens) di sebelah kanan kolom pencarian untuk memindai.", "Info Google Lens");
                
                // Beri waktu 3 detik bagi user untuk membaca pesan, lalu buka aplikasi Google utama
                setTimeout(() => {
                    window.location.href = "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.google.android.googlequicksearchbox;end";
                }, 3500);
            } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
                showGlassPopup("Gunakan Control Center pada iPhone Anda (usap dari sudut kanan atas) lalu pilih ikon QR Scanner.", "Petunjuk iOS");
            } else {
                showGlassPopup("Fitur buka scanner otomatis hanya tersedia di perangkat mobile.", "Tidak Didukung");
            }
        }
    </script>
</body>
</html>
