      <feMerge>

    <script>
        async function initSSID() {
            let ssid;
            // Ambil dari Vercel Serverless API jika diakses online di web HTTPS
            if (window.location.protocol !== 'file:') {
                try {
                    const res = await fetch('/api/wifi-config');
                    if (res.ok) {
                        const data = await res.json();
                        ssid = data.ssid;
                    }
                } catch(e) {
                    console.error("Gagal memuat SSID dari API Vercel:", e);
                }
            }

            // Fallback ke config.js lokal
            if (!ssid && typeof wifiConfig !== 'undefined') {
                ssid = wifiConfig.ssid;
            }

            if (ssid) {
                const wifiEl = document.getElementById('wifi-name-display');
                if (wifiEl) wifiEl.innerText = ssid;
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initSSID);
        } else {
            initSSID();
        }


        // Fitur tes kecepatan Ookla-Style (Realtime Instant Speed, Dynamic Needle & Micro-jitter)
        let currentDisplayMbps = 0;
        let targetMbps = 0;
        let animFrameId = null;
        let isTestingActive = false;

        function speedToProgress(s) {
            if (s <= 10) return (s / 10) * 0.25;
            if (s <= 100) return 0.25 + ((s - 10) / 90) * 0.25;
            if (s <= 500) return 0.50 + ((s - 100) / 400) * 0.25;
            if (s <= 1000) return 0.75 + ((s - 500) / 500) * 0.25;
            return 1;
        }

        function updateGaugeSmoothly() {
            const valueDisplay = document.getElementById('speed-value');
            const meter = document.getElementById('speed-meter');
            const needle = document.getElementById('speed-needle');

            if (!valueDisplay || !meter || !needle) return;

            // Interpolasi LERP (0.15 agar gerakan jarum sangat cepat merespons lonjakan jaringan)
            currentDisplayMbps += (targetMbps - currentDisplayMbps) * 0.15;

            // Efek Micro-jitter Alami khas Speedtest Ookla (getaran tipis jarum analog saat menguji)
            let renderSpeed = currentDisplayMbps;
            if (isTestingActive && currentDisplayMbps > 0.5) {
                const jitter = (Math.sin(Date.now() / 80) * (currentDisplayMbps * 0.018)) + ((Math.random() - 0.5) * 0.2);
                renderSpeed = Math.max(0, currentDisplayMbps + jitter);
            }

            valueDisplay.innerText = renderSpeed.toFixed(2);
            let progress = speedToProgress(renderSpeed);
            meter.style.strokeDashoffset = (330 - (330 * progress)).toFixed(2);
            needle.style.transform = `rotate(${(progress * 270).toFixed(2)}deg)`;

            if (animFrameId !== null) {
                animFrameId = requestAnimationFrame(updateGaugeSmoothly);
            }
        }

        async function runRobustSpeedTest() {
            const btn = document.getElementById('start-speed-btn');
            const pingDisplay = document.getElementById('ping-value');
            const valueDisplay = document.getElementById('speed-value');
            const meter = document.getElementById('speed-meter');
            const needle = document.getElementById('speed-needle');
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');

            if (btn.disabled) return;

            // Reset UI
            btn.disabled = true;
            btn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Menguji...';
            pingDisplay.innerText = '--';
            statusIndicator.className = 'w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_12px_rgba(59,130,246,0.6)] animate-pulse';
            statusText.innerText = 'Menguji Ping...';

            targetMbps = 0;
            currentDisplayMbps = 0;
            isTestingActive = true;
            meter.style.strokeDashoffset = "330";
            needle.style.transform = "rotate(0deg)";
            valueDisplay.innerText = '0.00';

            // Nonaktifkan transisi CSS agar kontrol rotasi dipengang 100% oleh 60fps LERP JS
            needle.style.transition = 'none';
            meter.style.transition = 'none';

            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            animFrameId = requestAnimationFrame(updateGaugeSmoothly);

            try {
                // 1. Fase Ping Akurat (8 Sampel + ResourceTiming + percentile 80)
                targetMbps = 3.5;
                const pingSamples = [];

                // Warm-up DNS & TLS Handshake
                try {
                    await fetch('https://speed.cloudflare.com/__down?bytes=0&nocache=' + Math.random(), { cache: 'no-store', mode: 'no-cors' });
                } catch (e) {}

                for (let i = 0; i < 8; i++) {
                    const pStart = performance.now();
                    try {
                        const url = 'https://speed.cloudflare.com/__down?bytes=0&nocache=' + Math.random();
                        await fetch(url, { cache: 'no-store', mode: 'no-cors' });
                        const pEnd = performance.now();

                        // Coba pakai Performance API Resource Timing jika tersedia untuk presisi tingkat milidetik hardware
                        let duration = pEnd - pStart;
                        const entries = performance.getEntriesByName(url);
                        if (entries && entries.length > 0) {
                            const entry = entries[entries.length - 1];
                            if (entry.duration > 0) duration = entry.duration;
                        }

                        const sampleTime = Math.round(duration);
                        if (sampleTime > 0) pingSamples.push(sampleTime);
                        pingDisplay.innerText = sampleTime;
                    } catch (e) {}
                    await new Promise(r => setTimeout(r, 40));
                }

                if (pingSamples.length > 0) {
                    pingSamples.sort((a, b) => a - b);
                    // Hapus outlier tertinggi (spike) & ambil median sampel terbaik
                    const validSamples = pingSamples.slice(0, Math.max(1, Math.floor(pingSamples.length * 0.75)));
                    const accuratePing = Math.round(validSamples.reduce((a, b) => a + b, 0) / validSamples.length);
                    pingDisplay.innerText = accuratePing;
                } else {
                    pingDisplay.innerText = '20';
                }

                // Reset jarum sebelum tes unduh
                targetMbps = 0.5;
                await new Promise(r => setTimeout(r, 250));

                // 2. Fase Unduh Tingkat Akurasi Tinggi 95%+ (4 Stream Paralel + 1.5s Warmup Exclusion + Sliding Window)
                statusText.innerText = 'Menguji Unduh...';
                statusIndicator.className = 'w-3 h-3 rounded-full bg-primary shadow-[0_0_12px_rgba(70,72,212,0.6)] animate-pulse';

                const testDuration = 9000; // 9 detik total
                const warmupDuration = 1500; // 1.5 detik awal diabaikan dari skor akhir (TCP Slow-Start Ramp up)
                const startTime = performance.now();
                const controller = new AbortController();

                let totalBytesDownloaded = 0;
                let measurementBytes = 0;
                let measurementStartTime = 0;
                const instantSamples = [];

                const downloadStream = async () => {
                    try {
                        const response = await fetch(`https://speed.cloudflare.com/__down?bytes=50000000&nocache=${Math.random()}`, {
                            cache: 'no-store',
                            signal: controller.signal
                        });

                        if (!response.ok) throw new Error("Fetch error");
                        const reader = response.body.getReader();

                        while (isTestingActive) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const now = performance.now();
                            const elapsedFromStart = now - startTime;
                            totalBytesDownloaded += value.length;

                            // Fase Pengukuran Riil (Setelah TCP Warm-up 1.5s)
                            if (elapsedFromStart >= warmupDuration) {
                                if (measurementStartTime === 0) measurementStartTime = now;
                                measurementBytes += value.length;
                            }

                            // Sliding window 400ms untuk jarum real-time
                            instantSamples.push({ time: now, bytes: totalBytesDownloaded });
                            while (instantSamples.length > 0 && (now - instantSamples[0].time) > 400) {
                                instantSamples.shift();
                            }

                            if (instantSamples.length > 1) {
                                const oldest = instantSamples[0];
                                const timeDiffSec = (now - oldest.time) / 1000;
                                const bytesDiff = totalBytesDownloaded - oldest.bytes;

                                if (timeDiffSec > 0.05) {
                                    const instantMbps = (bytesDiff * 8 / timeDiffSec) / 1000000;
                                    targetMbps = instantMbps;
                                }
                            }

                            if (elapsedFromStart >= testDuration) {
                                controller.abort();
                                break;
                            }
                        }
                    } catch (e) {}
                };

                // Jalankan 4 Stream Paralel untuk Memenuhi Bandwidth TCP Pipe secara Penuh (95%+ Saturation)
                await Promise.all([
                    downloadStream(),
                    downloadStream(),
                    downloadStream(),
                    downloadStream()
                ]);

                // Hitung Kecepatan Akurat Riil (Eksklusi Warmup)
                const measurementEndTime = performance.now();
                const finalDurationSec = measurementStartTime > 0 ? (measurementEndTime - measurementStartTime) / 1000 : (testDuration / 1000);
                const bytesToCalculate = measurementBytes > 0 ? measurementBytes : totalBytesDownloaded;

                let calculatedFinalMbps = 0;
                if (bytesToCalculate > 0 && finalDurationSec > 0) {
                    calculatedFinalMbps = (bytesToCalculate * 8 / finalDurationSec) / 1000000;
                }

                // Finalisasi Hasil Akhir Presisi 95%+
                isTestingActive = false;

                setTimeout(() => {
                    targetMbps = calculatedFinalMbps > 0 ? calculatedFinalMbps : currentDisplayMbps;

                    setTimeout(() => {
                        if (animFrameId) {
                            cancelAnimationFrame(animFrameId);
                            animFrameId = null;
                        }
                        currentDisplayMbps = targetMbps;
                        valueDisplay.innerText = currentDisplayMbps.toFixed(2);
                        let progress = speedToProgress(currentDisplayMbps);
                        meter.style.strokeDashoffset = (330 - (330 * progress)).toFixed(2);
                        needle.style.transform = `rotate(${(progress * 270).toFixed(2)}deg)`;

                        statusText.innerText = 'Selesai';
                        statusIndicator.className = 'w-3 h-3 rounded-full bg-green-500 shadow-[0_0_12px_rgba(34,197,94,0.6)]';
                        btn.disabled = false;
                        btn.innerHTML = '<span class="material-symbols-outlined">&#xe037;</span> Mulai Tes';
                    }, 500);
                }, 300);
            } catch (error) {
                console.error("Gagal melakukan tes jaringan", error);
                statusText.innerText = 'Gagal';
                isTestingActive = false;
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined">&#xe037;</span> Mulai Tes';
            }
        }
    </script>
</body>

</html>
