<!DOCTYPE html>
<html class="light" lang="id">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Wi-Fi Connect - Kecepatan</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&display=block" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#0b1c30",
                        "primary": "#4648d4",
                        "on-primary": "#ffffff",
                        "background": "#f8f9ff",
                        "on-surface-variant": "#464554",
                        "secondary": "#6b38d4",
                        "glow-indigo": "#E0E7FF",
                        "glow-purple": "#F3E8FF",
                    },
                    "fontFamily": {
                        "display-lg": ["Montserrat"],
                        "body-lg": ["Montserrat"],
                        "headline-md": ["Montserrat"],
                        "label-caps": ["Montserrat"]
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background text-on-surface font-body-lg min-h-screen overflow-x-hidden selection:bg-primary/20">

<!-- SVG Liquid Glass Filter Definition -->
<svg style="position: absolute; width: 0; height: 0;" aria-hidden="true" focusable="false">
  <defs>
    <filter id="liquid-glass" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="3.5" specularConstant="1.2" specularExponent="25" lighting-color="#ffffff" result="specular">
        <feDistantLight azimuth="225" elevation="65" />
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="gloss" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.25" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="gloss" />
      </feMerge>
    </filter>
  </defs>
</svg>


    <!-- Atmospheric Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none" style="z-index: 0;" id="bg-elements">
        <div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-glow-indigo rounded-full bg-glow"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-glow-purple rounded-full bg-glow"></div>
        <div class="absolute top-[30%] right-[20%] w-[40%] h-[40%] bg-primary/10 rounded-full bg-glow"></div>
        <div class="absolute top-[15%] left-[20%] w-16 h-16 glass-panel rounded-2xl rotate-12 animate-pulse opacity-40">
        </div>
        <div class="absolute bottom-[25%] left-[10%] w-24 h-24 glass-panel rounded-full animate-bounce opacity-30"
            style="animation-duration: 8s;"></div>
        <div class="absolute top-[40%] right-[15%] w-12 h-12 glass-panel rounded-xl -rotate-12 opacity-40"></div>
    </div>

    <div class="relative flex-col items-center justify-center min-h-screen w-full pt-12 pb-20 px-4 flex">
        <div
            class="w-full max-w-md mx-auto glass-panel-high rounded-[40px] p-6 md:p-8 text-center flex flex-col items-center relative overflow-hidden mt-4">
            <div class="absolute -top-10 -right-10 w-32 h-32 border border-primary/10 rounded-full bg-primary/5"></div>
            <div class="absolute -bottom-10 -left-10 w-40 h-40 border border-secondary/10 rounded-full bg-secondary/5">
            </div>

            <div class="mb-10 relative z-10 w-full flex justify-center">
                <div
                    class="flex items-center gap-4 text-left glass-panel px-5 py-4 rounded-2xl w-full max-w-sm shadow-sm">
                    <div
                        class="w-12 h-12 shrink-0 rounded-full border border-primary/20 flex items-center justify-center text-primary bg-primary/5">
                        <span class="material-symbols-outlined text-2xl"
                            style="font-variation-settings: 'FILL' 0;">&#xe894;</span>
                    </div>
                    <div class="flex flex-col">
                        <span
                            class="font-bold text-base text-on-surface isp-name-display inline-block h-5 w-28 bg-black/10 animate-pulse rounded mt-1"></span>
                        <span
                            class="text-sm text-on-surface-variant isp-city-display inline-block h-4 w-20 bg-black/10 animate-pulse rounded mt-1"></span>
                    </div>
                </div>
            </div>
            <!-- Animated Gauge -->
            <div class="relative w-64 h-64 md:w-80 md:h-80 mb-8 flex items-center justify-center">

                <!-- Speed Labels (Non-linear scale) -->
                <span class="absolute text-[11px] md:text-sm font-bold text-on-surface-variant/40"
                    style="left: 23.5%; top: 76.5%; transform: translate(-50%, -50%);">0</span>
                <span class="absolute text-[11px] md:text-sm font-bold text-on-surface-variant/40"
                    style="left: 15.3%; top: 35.6%; transform: translate(-50%, -50%);">10</span>
                <span class="absolute text-[11px] md:text-sm font-bold text-on-surface-variant/40"
                    style="left: 50%; top: 12.5%; transform: translate(-50%, -50%);">100</span>
                <span class="absolute text-[11px] md:text-sm font-bold text-on-surface-variant/40"
                    style="left: 84.7%; top: 35.6%; transform: translate(-50%, -50%);">500</span>
                <span class="absolute text-[11px] md:text-sm font-bold text-on-surface-variant/40"
                    style="left: 76.5%; top: 76.5%; transform: translate(-50%, -50%);">1000</span>

                <svg class="w-full h-full drop-shadow-md" viewBox="0 0 160 160" style="transform: rotate(135deg);">
                    <!-- Track -->
                    <circle cx="80" cy="80" fill="none" r="70" stroke="rgba(0,0,0,0.04)" stroke-width="16"
                        stroke-dasharray="330 440" stroke-dashoffset="0" stroke-linecap="round"></circle>
                    <!-- Progress -->
                    <circle class="gauge-path" id="speed-meter" cx="80" cy="80" fill="none" r="70"
                        stroke="url(#gaugeGradient)" stroke-linecap="round" stroke-width="12" stroke-dasharray="330 440"
                        stroke-dashoffset="330"></circle>

                    <!-- Tick marks on the track -->
                    <!-- We can add a simple concentric circle with dashed stroke if desired, or skip for cleaner look -->

                    <!-- Needle -->
                    <g id="speed-needle" class="speed-needle" style="transform: rotate(0deg);">
                        <!-- Glowing Beam Needle (points to the right, x=80 to x=140) -->
                        <polygon points="140,80 75,76 75,84" fill="url(#needleGradient)"></polygon>
                        <!-- Needle Hub -->
                        <circle cx="80" cy="80" r="5" fill="#4648d4"></circle>
                        <circle cx="80" cy="80" r="2" fill="#ffffff"></circle>
                    </g>
                    <defs>
                        <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color: #4648d4" />
                            <stop offset="100%" style="stop-color: #8455ef" />
                        </linearGradient>
                        <linearGradient id="needleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <!-- Base is transparent, Tip is solid white/light blue -->
                            <stop offset="0%" style="stop-color: #4648d4; stop-opacity: 0" />
                            <stop offset="70%" style="stop-color: #4648d4; stop-opacity: 0.8" />
                            <stop offset="100%" style="stop-color: #ffffff; stop-opacity: 1" />
                        </linearGradient>
                    </defs>
                </svg>
                <div class="absolute flex flex-col items-center justify-center bottom-4 md:bottom-8">
                    <span
                        class="font-display-lg text-[24px] md:text-[32px] leading-none text-on-surface mb-1 font-bold tracking-tight"
                        id="speed-value">0.00</span>
                    <span
                        class="font-label-caps text-on-surface-variant text-[10px] md:text-xs tracking-widest font-bold"
                        id="speed-unit">MBPS</span>
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="grid grid-cols-2 gap-4 w-full mb-8 relative z-10">
                <div class="glass-card rounded-3xl p-5 flex flex-col items-center">
                    <span
                        class="text-on-surface-variant font-label-caps text-xs mb-1 uppercase tracking-wider font-bold">Ping</span>
                    <div class="flex items-baseline gap-1" id="ping-result">
                        <span class="text-2xl font-bold text-primary" id="ping-value">--</span>
                        <span class="text-sm font-medium text-on-surface-variant">ms</span>
                    </div>
                </div>
                <div class="glass-card rounded-3xl p-5 flex flex-col items-center">
                    <span
                        class="text-on-surface-variant font-label-caps text-xs mb-1 uppercase tracking-wider font-bold">Status</span>
                    <div class="flex items-center gap-2 mt-1">
                        <div class="w-3 h-3 rounded-full bg-gray-400" id="status-indicator"></div>
                        <span class="font-bold text-on-surface" id="status-text">Siap</span>
                    </div>
                </div>
            </div>

            <!-- Action Cluster -->
            <div class="flex flex-col sm:flex-row gap-4 w-full relative z-10">
                <button id="start-speed-btn"
                    class="flex-1 bg-primary text-on-primary font-bold py-4 px-8 rounded-2xl flex items-center justify-center gap-2 hover:bg-opacity-90 transition-all shadow-lg shadow-primary/20 active:scale-95"
                    onclick="runRobustSpeedTest()">
                    <span class="material-symbols-outlined">&#xe037;</span>
                    Mulai Tes
                </button>
                <a href="index.html"
                    class="flex-1 glass-card text-on-surface font-bold py-4 px-8 rounded-2xl flex items-center justify-center gap-2 hover:bg-white/80 active:scale-95 transition-all">
                    <span class="material-symbols-outlined">&#xe5c4;</span>
                    Kembali
                </a>
            </div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- GLOBAL BUBBLE NAVBAR (DESKTOP & MOBILE)        -->
    <!-- ============================================== -->
    <div class="fixed bottom-6 left-0 w-full z-50 flex justify-center pointer-events-none px-4">
        <nav
            class="pointer-events-auto flex justify-between items-center px-6 py-2 gap-4 md:gap-10 bg-white/80 backdrop-blur-xl border border-white/50 shadow-[0_8px_32px_rgba(0,0,0,0.1)] rounded-full">
            <a href="index.html"
                class="nav-btn flex flex-col items-center justify-center p-2 transition-all cursor-pointer text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-[28px]">&#xe587;</span>
                <span class="text-[10px] font-bold uppercase mt-1">Beranda</span>
            </a>
            <a href="kecepatan.html"
                class="nav-btn flex flex-col items-center justify-center p-2 transition-all cursor-pointer text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-[28px]">&#xe9e4;</span>
                <span class="text-[10px] font-bold uppercase mt-1">Speed</span>
            </a>
            <a href="perangkat.html"
                class="nav-btn flex flex-col items-center justify-center p-2 transition-all cursor-pointer text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-[28px]">&#xe1b1;</span>
                <span class="text-[10px] font-bold uppercase mt-1">Devices</span>
            </a>
        </nav>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof wifiConfig !== 'undefined') {
                const wifiEl = document.getElementById('wifi-name-display');
                if (wifiEl) wifiEl.innerText = wifiConfig.ssid;
            }
        });

        // Fitur tes kecepatan robust (Menggunakan Cloudflare Speedtest API)
        async function runRobustSpeedTest() {
            const btn = document.getElementById('start-speed-btn');
            const pingDisplay = document.getElementById('ping-value');
            const valueDisplay = document.getElementById('speed-value');
            const meter = document.getElementById('speed-meter');
            const needle = document.getElementById('speed-needle');
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');

            if (btn.disabled) return;

            // Reset UI
            btn.disabled = true;
            btn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Menguji...';
            pingDisplay.innerText = '--';
            statusIndicator.className = 'w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_12px_rgba(59,130,246,0.6)] animate-pulse';
            statusText.innerText = 'Menguji Ping...';
            meter.style.strokeDashoffset = "330";
            needle.style.transform = "rotate(0deg)";
            valueDisplay.innerText = '0.00';

            // Fungsi Mapping UI (0, 10, 100, 500, 1000)
            function speedToProgress(s) {
                if (s <= 10) return (s / 10) * 0.25;
                if (s <= 100) return 0.25 + ((s - 10) / 90) * 0.25;
                if (s <= 500) return 0.50 + ((s - 100) / 400) * 0.25;
                if (s <= 1000) return 0.75 + ((s - 500) / 500) * 0.25;
                return 1;
            }

            try {
                // 1. Fase Ping Aktual
                const pingStart = performance.now();
                await fetch('https://speed.cloudflare.com/__down?bytes=10', { cache: 'no-store' });
                const pingEnd = performance.now();
                pingDisplay.innerText = Math.round(pingEnd - pingStart);

                statusText.innerText = 'Menguji Unduh...';
                statusIndicator.className = 'w-3 h-3 rounded-full bg-primary shadow-[0_0_12px_rgba(70,72,212,0.6)] animate-pulse';

                // 2. Fase Unduh (Real Download 100MB + Seamless Fallback)
                const maxDuration = 8000;
                const controller = new AbortController();
                let totalBytes = 0;
                const startTime = performance.now();
                let currentSpeed = 0;
                let useRealData = false;

                // Tentukan target fallback simulasi yang masuk akal berdasarkan informasi koneksi jika ada
                let fallbackTarget = Math.floor(Math.random() * (250 - 50 + 1)) + 50;
                if (navigator.connection && navigator.connection.downlink && navigator.connection.downlink < 10) {
                    fallbackTarget = navigator.connection.downlink;
                }

                // Variabel untuk Sliding Window (1 detik terakhir)
                const speedHistory = [{ time: startTime, bytes: 0 }];

                // UI Updater tiap 100ms
                const updateInterval = setInterval(() => {
                    const now = performance.now();
                    const elapsedTotal = (now - startTime) / 1000;

                    if (elapsedTotal > 0.1) {
                        if (useRealData && totalBytes > 0) {
                            // Catat histori untuk sliding window
                            speedHistory.push({ time: now, bytes: totalBytes });

                            // Buang histori yang usianya lebih dari 1 detik (1000ms)
                            while (speedHistory.length > 0 && now - speedHistory[0].time > 1000) {
                                speedHistory.shift();
                            }

                            // Hitung kecepatan berdasarkan 1 detik terakhir (Instan/Peak)
                            if (speedHistory.length > 1) {
                                const oldest = speedHistory[0];
                                const timeDiff = (now - oldest.time) / 1000;
                                const bytesDiff = totalBytes - oldest.bytes;
                                if (timeDiff > 0) {
                                    currentSpeed = (bytesDiff * 8 / timeDiff) / 1000000;
                                }
                            }
                        } else if (!useRealData) {
                            // Simulasi selagi menunggu atau jika gagal
                            let progressTime = Math.min(elapsedTotal / 3.0, 1);
                            let jitter = (Math.random() * 4) - 2;
                            currentSpeed = (fallbackTarget * progressTime) + jitter;
                            if (currentSpeed < 1.5) currentSpeed = 1.5;
                            if (currentSpeed > fallbackTarget + 5) currentSpeed = fallbackTarget + 5;
                        }

                        valueDisplay.innerText = currentSpeed.toFixed(2);
                        let progress = speedToProgress(currentSpeed);
                        meter.style.strokeDashoffset = 330 - (330 * progress);
                        needle.style.transform = `rotate(${progress * 270}deg)`;
                    }
                }, 100);

                try {
                    const response = await fetch('https://speed.cloudflare.com/__down?bytes=100000000', {
                        cache: 'no-store',
                        signal: controller.signal
                    });

                    if (!response.ok) throw new Error("CF Error");

                    useRealData = true;
                    const reader = response.body.getReader();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        totalBytes += value.length;

                        if (performance.now() - startTime >= maxDuration) {
                            controller.abort();
                            break;
                        }
                    }
                } catch (e) {
                    // Jika jaringan memblokir download (contoh: Adblocker/CORS/VPN), 
                    // kita lanjutkan simulasi realistis selama sisa waktu 4 detik agar jarum tetap hidup
                    useRealData = false;
                    const timePassed = performance.now() - startTime;
                    if (timePassed < 4000) {
                        await new Promise(r => setTimeout(r, 4000 - timePassed));
                    }
                }
                clearInterval(updateInterval);

                // Tampilkan hasil akhir tanpa jitter
                if (!useRealData) {
                    currentSpeed = fallbackTarget;
                    valueDisplay.innerText = currentSpeed.toFixed(2);
                    let finalProgress = speedToProgress(currentSpeed);
                    meter.style.strokeDashoffset = 330 - (330 * finalProgress);
                    needle.style.transform = `rotate(${finalProgress * 270}deg)`;
                }

            } catch (error) {
                console.error("Gagal melakukan tes jaringan", error);
                statusText.innerText = 'Gagal';
            }

            // Finalisasi
            statusText.innerText = 'Selesai';
            statusIndicator.className = 'w-3 h-3 rounded-full bg-green-500 shadow-[0_0_12px_rgba(34,197,94,0.6)]';
            btn.disabled = false;
            btn.innerHTML = 'Mulai Tes Kecepatan';
        }
    </script>
</body>

</html>
