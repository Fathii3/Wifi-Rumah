<!DOCTYPE html>
<html class="light" lang="id">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Wi-Fi Connect - Perangkat</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&display=block" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#0b1c30",
                        "primary": "#4648d4",
                        "on-primary": "#ffffff",
                        "background": "#f8f9ff",
                        "on-surface-variant": "#464554",
                        "surface-variant": "#d3e4fe",
                        "secondary": "#6b38d4",
                        "glow-indigo": "#E0E7FF",
                        "glow-purple": "#F3E8FF",
                    },
                    "fontFamily": {
                        "display-lg": ["Montserrat"],
                        "body-lg": ["Montserrat"],
                        "headline-md": ["Montserrat"],
                        "label-caps": ["Montserrat"]
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background text-on-surface font-body-lg min-h-screen overflow-x-hidden selection:bg-primary/20">

<!-- SVG Liquid Glass Filter Definition -->
<svg style="position: absolute; width: 0; height: 0;" aria-hidden="true" focusable="false">
  <defs>
    <filter id="liquid-glass" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="3.5" specularConstant="1.2" specularExponent="25" lighting-color="#ffffff" result="specular">
        <feDistantLight azimuth="225" elevation="65" />
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="gloss" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.25" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="gloss" />
      </feMerge>
    </filter>
  </defs>
</svg>


    <!-- Atmospheric Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none" style="z-index: 0;" id="bg-elements">
        <div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-glow-indigo rounded-full bg-glow"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-glow-purple rounded-full bg-glow"></div>
        <div class="absolute top-[30%] right-[20%] w-[40%] h-[40%] bg-primary/10 rounded-full bg-glow"></div>
    </div>

    <div class="relative flex-col items-center justify-center min-h-screen w-full pt-12 pb-20 px-4 flex">
        <div class="w-full max-w-2xl mx-auto flex flex-col items-center py-4 z-10 mt-6">
            <div class="text-center mb-8 space-y-2">
                <h2 class="font-display-lg text-2xl md:text-3xl text-primary font-bold">Pemantauan Jaringan</h2>
                <p class="text-on-surface-variant font-body-lg">Daftar perangkat yang terhubung</p>
            </div>

            <div class="glass-panel-high rounded-[2rem] w-full overflow-hidden shadow-lg border-white/80">
                <div class="bg-surface-variant/30 px-6 py-4 flex justify-between items-center border-b border-black/5">
                    <span class="font-bold text-sm text-on-surface uppercase tracking-wider">Perangkat Terdeteksi</span>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                        <span class="text-xs font-semibold text-green-700">Live</span>
                    </div>
                </div>

                <div id="devices-list" class="flex flex-col divide-y divide-black/5 p-2">
                    <!-- Skeleton Loader -->
                    <div class="flex items-center justify-between p-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-primary/10 animate-pulse"></div>
                            <div class="space-y-2">
                                <div class="h-3.5 bg-black/10 rounded w-24 animate-pulse"></div>
                                <div class="h-2.5 bg-black/10 rounded w-32 animate-pulse"></div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <div class="h-3 bg-black/10 rounded w-16 animate-pulse"></div>
                            <div class="h-3 bg-black/10 rounded w-16 animate-pulse"></div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-primary/10 animate-pulse"></div>
                            <div class="space-y-2">
                                <div class="h-3.5 bg-black/10 rounded w-20 animate-pulse"></div>
                                <div class="h-2.5 bg-black/10 rounded w-28 animate-pulse"></div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <div class="h-3 bg-black/10 rounded w-14 animate-pulse"></div>
                            <div class="h-3 bg-black/10 rounded w-14 animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- GLOBAL BUBBLE NAVBAR (DESKTOP & MOBILE)        -->
    <!-- ============================================== -->
    <div class="fixed bottom-6 left-0 w-full z-50 flex justify-center pointer-events-none px-4">
        <nav
            class="pointer-events-auto flex justify-between items-center px-6 py-2 gap-4 md:gap-10 bg-white/80 backdrop-blur-xl border border-white/50 shadow-[0_8px_32px_rgba(0,0,0,0.1)] rounded-full">
            <a href="index.html"
                class="nav-btn flex flex-col items-center justify-center p-2 transition-all cursor-pointer text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-[28px]">&#xe587;</span>
                <span class="text-[10px] font-bold uppercase mt-1">Beranda</span>
            </a>
            <a href="kecepatan.html"
                class="nav-btn flex flex-col items-center justify-center p-2 transition-all cursor-pointer text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-[28px]">&#xe9e4;</span>
                <span class="text-[10px] font-bold uppercase mt-1">Speed</span>
            </a>
            <a href="perangkat.html"
                class="nav-btn flex flex-col items-center justify-center p-2 transition-all cursor-pointer text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-[28px]">&#xe1b1;</span>
                <span class="text-[10px] font-bold uppercase mt-1">Devices</span>
            </a>
        </nav>
    </div>

    <script src="app.js"></script>
    <script>
        let currentDevices = [];

        async function fetchDevices() {
            try {
                // Arahkan ke tunnel HTTPS Anda jika website dibuka dari Vercel (bukan lokal)
                const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '192.168.1.2';
                const apiHost = isLocal ? '' : 'https://chubby-doors-spend.loca.lt';
                const response = await fetch(`${apiHost}/api/devices`);
                
                if (!response.ok) {
                    // Coba ambil pesan error dari server NodeJS
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || 'Network response was not ok');
                }
                
                const data = await response.json();
                currentDevices = data;
                renderDevices();
            } catch (error) {
                console.error('Fetch error:', error);
                
                let title = "Akses Ditolak";
                let errorMessage = "Anda harus terhubung ke jaringan Wi-Fi lokal untuk melihat daftar perangkat.";
                
                // Jika errornya dari router (pesan dari server.js)
                if (error.message.includes("loading") || error.message.includes("mengambil data")) {
                    title = "Gagal Memuat Data";
                    errorMessage = error.message;
                }

                const list = document.getElementById('devices-list');
                list.innerHTML = `
                    <div class="p-8 text-center flex flex-col items-center justify-center gap-4">
                        <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center text-red-600 mb-2">
                            <span class="material-symbols-outlined text-[36px]">&#xe648;</span>
                        </div>
                        <h3 class="font-bold text-lg text-on-surface">${title}</h3>
                        <p class="text-on-surface-variant text-sm">${errorMessage}</p>
                    </div>
                `;
            }
        }

        function getDeviceIcon(iconName) {
            const map = {
                'smartphone': '&#xe32c;',
                'laptop': '&#xe31e;',
                'tablet': '&#xe32f;',
                'desktop': '&#xe30c;',
                'tv': '&#xe333;',
                'gamepad': '&#xe338;'
            };
            return map[iconName] || '&#xe32c;';
        }

        function renderDevices() {
            const list = document.getElementById('devices-list');
            if (currentDevices.length === 0) {
                list.innerHTML = '<div class="p-8 text-center text-sm text-on-surface-variant font-medium">Belum ada perangkat terhubung.</div>';
                return;
            }
            
            list.innerHTML = '';

            currentDevices.forEach((dev) => {
                let currentDown = "Tidak Terdeteksi";
                let currentUp = "Tidak Terdeteksi";

                // Jika baseDown > 0, berarti kita dapat data bandwidth
                if (dev.baseDown && dev.baseDown > 0) {
                    const jitterDown = (Math.random() * 5) - 2; // jitter yang lebih besar untuk kbps
                    const jitterUp = (Math.random() * 1) - 0.5;
                    currentDown = Math.max(0, dev.baseDown + jitterDown).toFixed(1) + " Kbps";
                    currentUp = Math.max(0, dev.baseUp + jitterUp).toFixed(1) + " Kbps";
                }

                // Anggap aktif jika data berhasil didapat (router biasanya menghapus yang lama)
                const statusLabel = `<span class="px-2 py-0.5 bg-green-100 text-green-700 rounded text-[10px] font-bold uppercase tracking-wider">Aktif</span>`;

                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-4 hover:bg-black/5 transition-colors rounded-xl";
                row.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined">${getDeviceIcon(dev.icon)}</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <p class="font-bold text-sm text-on-surface">${dev.name}</p>
                            ${statusLabel}
                        </div>
                        <p class="text-xs text-on-surface-variant font-mono mt-0.5">IP: ${dev.ip || '-'} | MAC: ${dev.mac || '-'}</p>
                    </div>
                </div>
                <div class="flex flex-col items-end gap-1 text-xs font-semibold">
                    <div class="flex items-center gap-1 text-blue-600">
                        <span class="material-symbols-outlined text-[14px]">&#xe5db;</span>
                        <span class="text-right">${currentDown}</span>
                    </div>
                    <div class="flex items-center gap-1 text-purple-600">
                        <span class="material-symbols-outlined text-[14px]">&#xe5d8;</span>
                        <span class="text-right">${currentUp}</span>
                    </div>
                </div>
            `;
                list.appendChild(row);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchDevices();
            // Update data dari server lokal dan animasi UI setiap 2 detik
            setInterval(fetchDevices, 2000);
        });
    </script>
</body>

</html>
